<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>hedgehog</title>
  <meta name="description" content="Bet tracker and live college football dashboard: log straight bets and parlays, sweat them live, and build slips against real lines.">
  <meta name="theme-color" content="#09080c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f5f9" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="hedgehog">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#bets" aria-label="hedgehog home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><defs><linearGradient id="brand-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a1ff"/><stop offset="1" stop-color="#8b6cf6"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#brand-g)"/><g transform="translate(32 32.5) scale(0.8474) translate(-31.598 -34.215)"><polygon points="9.66,46.13 2.10,43.97 9.08,40.51 3.00,35.73 10.91,35.09 7.16,28.37 14.88,30.65 14.00,22.95 20.43,27.83 22.54,20.23 26.76,27.02 31.57,20.60 32.99,28.33 39.81,24.01 38.23,31.58 38.00,44.50 18.00,47.50 9.50,46.00" fill="#1b1330" stroke="#1b1330" stroke-width="3.4" stroke-linejoin="round"/><path d="M30.5 26 C40 20.5 50.5 26.5 57 34.5 C60.1 38.4 58.9 42.6 53.9 43.6 L41 46.4 C32.5 48.2 26.7 43.6 27.1 36.6 C27.4 31.8 28.4 28 30.5 26 Z" fill="#fff"/><circle cx="57.9" cy="37.6" r="3.2" fill="#1b1330"/><circle cx="43.7" cy="33.2" r="2.7" fill="#1b1330"/><circle cx="44.6" cy="32.3" r="0.9" fill="#fff"/><ellipse cx="39.3" cy="39.8" rx="3.1" ry="1.9" fill="#f7a8c4" opacity=".9"/></g></svg>
      <span>hedgehog</span>
      <span id="demo-flag" class="demo-flag" hidden>Demo</span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="top-r">
      <span class="today-top" id="today-top"></span>
      <div id="sport-toggle" class="sport-seg" role="group" aria-label="League"></div>
      <span id="sync" class="sync" aria-hidden="true"></span>
      <div id="fmt-toggle" class="fmt-top"></div>
      <button class="btn sm primary add-top" id="btn-add" data-act="open-add"></button>
      <button class="icon-btn" id="btn-settings" data-act="open-settings" aria-label="Settings"></button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <button id="fab" class="fab" data-act="open-add" aria-label="Add a pick"></button>
  <div id="dock" class="dock" hidden></div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <datalist id="books"></datalist>
  <input type="file" id="slip-file" accept="image/*" hidden>
  <div id="dropover" class="dropover" hidden><div><span class="dz-ico big"></span><b>Drop your bet slip</b><span>hedgehog will read it and fill in the bet</span></div></div>

  <noscript><p style="padding:24px">Linewatch needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
